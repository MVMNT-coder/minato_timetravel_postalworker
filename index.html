<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>時空郵便局</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/components.css">
<link rel="stylesheet" href="src/styles/opening.css">
<link rel="stylesheet" href="src/styles/scenes.css">
<link rel="stylesheet" href="src/styles/overlays.css">
<script src="config.js"></script>
</head>
<body>
<canvas id="fxb" aria-hidden="true" hidden></canvas>
<div id="stage">
  <div class="stage app">
    <header class="bar">
      <span class="bar-brand">SPACETIME POST OFFICE</span>
      <div class="bar-meta"><span class="status" id="barStatus">受付中</span><span>渋谷窓口</span><span class="t-data digits" id="clock"></span><button class="bar-snd" id="snd" type="button" aria-pressed="false">音なし</button></div>
    </header>
    <main class="scene" id="card" aria-live="polite"></main>
    <footer class="foot">
      <div class="act">
        <button class="cta" id="push" type="button" hidden><span class="cta-key" aria-hidden="true"></span><span id="pushL"></span></button>
        <button class="btn-quiet" id="next" type="button" hidden>次へ</button>
        <span class="speaking" id="note" hidden aria-hidden="true"><i></i><i></i><i></i><span id="noteL"></span></span>
      </div>
      <ol class="chapters" id="chapters" hidden aria-label="体験の流れ">
        <li><b>1</b>手紙を読む</li><li><b>2</b>物を撮る</li><li><b>3</b>2126年へ送る</li><li><b>4</b>結果を見る</li>
      </ol>
    </footer>
  </div>
  <div class="idle" id="idle" hidden></div>
</div>
<!-- 読み込む順番に意味があります（あとのファイルが、前のファイルの関数を使う） -->
<script src="src/js/core.js"></script>
<script src="src/js/camera.js"></script>
<script src="src/js/art.js"></script>
<script src="src/js/stories.js"></script>
<script src="src/js/audio.js"></script>
<script src="src/js/figure.js"></script>
<script src="src/js/transfer.js"></script>
<script src="src/js/fx.js"></script>
<script src="src/js/scenes.js"></script>
<script src="src/js/idle.js"></script>
<script src="src/js/gallery.js"></script>
<script src="src/js/staff.js"></script>
<script src="src/js/main.js"></script>
</body>
</html>
