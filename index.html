    tick(){noise(.06,{vol:.035,f:4000,q:1})},
    error(){tone(330,.25,{type:"sawtooth",vol:.12,slide:165});tone(220,.4,{type:"sawtooth",vol:.12,at:.22,slide:110});bgmDuck(1,1)}
  };
})();


/* ===== minatoの声 =====
   展示PCで動かす VOICEVOX（無料の音声合成ソフト）に文章を送り、返ってきた音声を再生する。
   VOICEVOX が起動していないときは、ブラウザ内蔵の読み上げで代用する */
const VOICE=(()=>{
  let base=lsGet("mirai_vv_url","http://127.0.0.1:50021"),spk=Number(lsGet("mirai_vv_speaker","6")),vol=Number(lsGet("mirai_voice_vol","1"));
  let ok=null,cur=null,token=0,spkName="";const cache=new Map();
  async function check(){
    try{const r=await fetch(base+"/version",{signal:AbortSignal.timeout(1500)});ok=r.ok}catch{ok=false}
    if(ok)speakers().then(list=>{const s=list.find(x=>x.id===spk);spkName=s?s.name:"";credit()}).catch(()=>{});
    return ok;
  }
  async function speakers(){
    const r=await fetch(base+"/speakers",{signal:AbortSignal.timeout(3000)});const j=await r.json();
    return j.flatMap(c=>c.styles.map(s=>({id:s.id,name:`${c.name}（${s.name}）`,chara:c.name})));
  }
  function credit(){const el=$("#vvcredit");if(el)el.textContent=ok&&spkName?`音声：VOICEVOX:${spkName.replace(/（.*/,"")}`:""}
  function clean(t){return String(t).replace(/[「」『』]/g,"").replace(/…+/g,"、").replace(/！？|!\?/g,"？")}
  function synth(text){
    const key=spk+"|"+text;if(cache.has(key))return cache.get(key);
    const p=(async()=>{
      const q=await fetch(`${base}/audio_query?speaker=${spk}&text=${encodeURIComponent(clean(text))}`,{method:"POST"});if(!q.ok)throw new Error("audio_query "+q.status);
      const qj=await q.json();qj.speedScale=1.1;qj.intonationScale=1.2;qj.prePhonemeLength=.05;qj.postPhonemeLength=.1;
      const r=await fetch(`${base}/synthesis?speaker=${spk}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(qj)});if(!r.ok)throw new Error("synthesis "+r.status);
      return URL.createObjectURL(await r.blob());
    })();
    cache.set(key,p);p.catch(()=>cache.delete(key));
    if(cache.size>40){const k=cache.keys().next().value;cache.delete(k)}
    return p;
  }
  function browserSay(text,my){
    if(!("speechSynthesis" in window))return;
    const u=new SpeechSynthesisUtterance(clean(text));u.lang="ja-JP";u.rate=1.08;u.pitch=1.05;u.volume=Math.min(1,vol);
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("ja"));if(v)u.voice=v;
    u.onstart=()=>SND.duck(.35);u.onend=u.onerror=()=>{if(my===token)SND.duck(1)};
    speechSynthesis.speak(u);
  }
  function stop(){token++;if(cur){cur.pause();cur=null}try{speechSynthesis.cancel()}catch{}SND.duck(1)}
  async function say(text){
    stop(); // 前の声を止めてから話す（二重に再生しない）
    if(!text||!SND.isOn())return;
    const my=token;
    if(ok===null)await check();
    if(my!==token)return;
    if(!ok)return browserSay(text,my);
    try{
      const url=await synth(text);if(my!==token)return;
      const a=new Audio(url);a.volume=Math.max(0,Math.min(1,vol));cur=a;
      a.onplay=()=>SND.duck(.35);a.onended=()=>{if(my===token){cur=null;SND.duck(1)}};
      await a.play();
    }catch(e){if(my===token)browserSay(text,my)}
  }
  check();
  return{
    say,stop,
    prepare(text){if(ok)synth(text).catch(()=>{})}, // 先に音声を作っておき、話し始めの待ちをなくす
    status:async()=>{await check();return{ok,base,spk,spkName}},
    speakers,
    setSpeaker(id){spk=Number(id);lsSet("mirai_vv_speaker",String(spk));cache.clear();check()},
    setVol(v){vol=v;lsSet("mirai_voice_vol",String(v));if(cur)cur.volume=Math.max(0,Math.min(1,v))},
    vol:()=>vol,credit
  };
})();

/* minatoの姿：粒子が集まって人の上半身の形に揺れる */
function minatoFigure(cv,{talk=false}={}){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr=Math.min(2,devicePixelRatio||1),r=cv.getBoundingClientRect();
  const W=Math.max(60,r.width),H=Math.max(80,r.height);
  cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
  const sub=cv.parentElement.querySelector(".figid")?18:0, FH=H-sub;
  // 形の判定（0〜1の座標）：頭・首・肩
  function inside(x,y){
    const hx=(x-.5)/.21,hy=(y-.33)/.23;if(hx*hx+hy*hy<1)return true;
    if(y>.52&&y<.7&&Math.abs(x-.5)<.075)return true;
    if(y>=.64&&y<=1){const k=Math.min(1,(y-.64)/.14),hw=.12+Math.sin(k*Math.PI/2)*.34;return Math.abs(x-.5)<hw}
    return false;
  }
  const ps=Math.max(1,W/210),N=Math.round(Math.min(4500,W*FH/(9*ps*ps))),P=[];
  while(P.length<N){
    const x=Math.random(),y=Math.random();if(!inside(x,y))continue;
    // 顔の中心と胸元を少し濃く
    const d=Math.hypot(x-.5,(y-.42)*1.3);if(Math.random()>.45+.55*Math.exp(-d*d*18))continue;
    P.push({hx:x,hy:y,x:Math.random(),y:Math.random()*1.1,vx:0,vy:0,a:.25+Math.random()*.75,s:Math.random()<.12?1.6:1,ph:Math.random()*6.28});
  }
  let raf,kick=0;const t0=performance.now();
  cv.parentElement._kick=()=>{kick=1};
  function frame(now){
    const t=(now-t0)/1000;
    ctx.clearRect(0,0,W,H);
    const sway=Math.sin(t*.7)*.008,breath=1+Math.sin(t*1.6)*.006;
    const amp=talk?(.004+.004*(Math.sin(t*9)*.5+.5)*(Math.sin(t*1.3)>-.2?1:.2)):.003;
    if(kick>0){for(const p of P){p.vx+=(Math.random()-.5)*.03*kick;p.vy+=(Math.random()-.5)*.02*kick}kick=0}
    for(const p of P){
      const tx=.5+(p.hx-.5)*breath+sway*(1-p.hy),ty=p.hy;
      p.vx+=(tx-p.x)*.045+Math.sin(t*2+p.ph)*amp*.15+(Math.random()-.5)*amp;
      p.vy+=(ty-p.y)*.045+Math.cos(t*1.7+p.ph)*amp*.15+(Math.random()-.5)*amp;
      p.vx*=.82;p.vy*=.82;p.x+=p.vx;p.y+=p.vy;
      const fl=.6+.4*Math.sin(t*3+p.ph);
      ctx.fillStyle=`rgba(255,${110+(p.ph*20|0)},${40+(p.ph*8|0)},${p.a*fl})`;
      ctx.fillRect(p.x*W,p.y*FH,p.s*ps,p.s*ps);
    }
    // 足元の走査線
    ctx.fillStyle="rgba(255,92,0,.35)";ctx.fillRect(W*.15,FH*.995,W*.7,1);
    if(!reduce)raf=requestAnimationFrame(frame);
  }
  if(reduce){for(const p of P){p.x=p.hx;p.y=p.hy}}
  raf=requestAnimationFrame(frame);
  return()=>cancelAnimationFrame(raf);
}


/* 未来の要素にときどきグリッチをかける（通信が不安定な感じ） */
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const GL="▓▒░#%&@$01ﾐﾅﾄ█▚▞";
  function glitchEl(el){
    if(el.classList.contains("gl"))return;
    el.classList.remove("gl");void el.offsetWidth;el.classList.add("gl");
    if(el.dataset.fx==="text"&&el.children.length===0){
      const orig=el.textContent;let n=0;
      const iv=setInterval(()=>{
        if(!el.isConnected){clearInterval(iv);return}
        el.textContent=[...orig].map(c=>c.trim()&&Math.random()<.35?GL[Math.random()*GL.length|0]:c).join("");
        if(++n>5){clearInterval(iv);el.textContent=orig}
      },55);
    }
    setTimeout(()=>el.classList.remove("gl"),400);
  }
  function visible(el){const r=el.getBoundingClientRect();return r.width>0&&r.bottom>0&&r.top<innerHeight}
  function small(){
    if(!document.querySelector(".view.warp")){
      const els=[...document.querySelectorAll("[data-fx]")].filter(visible);
      if(els.length){
        const n=Math.random()<.3?2:1;
        for(let i=0;i<n;i++){const el=els[Math.random()*els.length|0];glitchEl(el);el._kick&&el._kick()}
        SND.tick();
      }
    }
    setTimeout(small,3500+Math.random()*6000);
  }
  function big(){
    if(!document.querySelector(".view.warp")&&!document.body.dataset.calm){
      const w=document.querySelector(".wrap"),st=$("#static");
      w.classList.remove("pg");st.classList.remove("on");void w.offsetWidth;
      w.classList.add("pg");st.classList.add("on");SND.static();
      setTimeout(()=>{w.classList.remove("pg");st.classList.remove("on")},360);
    }
    setTimeout(big,18000+Math.random()*20000);
  }
  setTimeout(small,2500);
  setTimeout(big,12000);
})();


/* ===== 外周の演出（演出ありモード） =====
   画面（#stage）を中央に縮めて表示し、その外側の余白に演出を描く。
   プロジェクターでスクリーンからはみ出した部分が、そのまま演出になる想定 */
const FXB=(()=>{
  let m=Math.max(3,Math.min(15,Number(lsGet("mirai_fx_margin","5"))||5)),mode="idle",t0=performance.now();
  const api={set(){},margin:()=>m,setMargin(v){m=v;lsSet("mirai_fx_margin",String(v));apply()}};
  function apply(){document.documentElement.style.setProperty("--fxs",String(1-2*m/100))}
  if(!FXMODE)return api;
  document.body.classList.add("fxmode");apply();
  const cv=$("#fxb"),ctx=cv.getContext("2d");cv.hidden=false;
  let W,H;function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener("resize",size);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let P=[];
  api.set=v=>{if(v===mode)return;mode=v;t0=performance.now();if(v!=="warp")P=P.filter(p=>p.k!=="streak")};
  // ページの切り替わりを見て、演出を自動で切り替える
  const MAP={title:"idle",story:"comm",mission:"comm",request:"comm",camera:"scan",confirm:"scan",warp:"warp",result:"suspense"};
  new MutationObserver(()=>{const pg=card.dataset.page;if(MAP[pg])api.set(MAP[pg])}).observe(card,{attributes:true,attributeFilter:["data-page"]});
  const R=()=>({x0:W*m/100,y0:H*m/100,x1:W*(1-m/100),y1:H*(1-m/100)});
  // 外周上の位置 p(0〜1) → 画面の縁の座標と外向きの向き
  function edge(p){const r=R(),w=r.x1-r.x0,h=r.y1-r.y0,L=2*(w+h);let d=((p%1)+1)%1*L;
    if(d<w)return{x:r.x0+d,y:r.y0,nx:0,ny:-1};d-=w;
    if(d<h)return{x:r.x1,y:r.y0+d,nx:1,ny:0};d-=h;
    if(d<w)return{x:r.x1-d,y:r.y1,nx:0,ny:1};d-=w;
    return{x:r.x0,y:r.y1-d,nx:-1,ny:0}}
  // 画面の縁から外へ向かってにじむ光
  function glow(rgb,a){if(a<=0)return;const r=R(),mx=r.x0,my=r.y0,c0=`rgba(${rgb},${a})`,c1=`rgba(${rgb},0)`;
    const lin=(x0,y0,x1,y1,x,y,w,h)=>{const g=ctx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.fillRect(x,y,w,h)};
    lin(0,r.y0,0,0,r.x0,0,r.x1-r.x0,my);lin(0,r.y1,0,H,r.x0,r.y1,r.x1-r.x0,my);lin(r.x0,0,0,0,0,r.y0,mx,r.y1-r.y0);lin(r.x1,0,W,0,r.x1,r.y0,mx,r.y1-r.y0);
    // 四隅は角から丸く広がる光にして、つなぎ目を出さない
    for(const [cx,cy,x,y] of [[r.x0,r.y0,0,0],[r.x1,r.y0,r.x1,0],[r.x0,r.y1,0,r.y1],[r.x1,r.y1,r.x1,r.y1]]){
      ctx.save();ctx.translate(cx,cy);ctx.scale(mx,my);const g=ctx.createRadialGradient(0,0,0,0,0,1);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.fillRect((x-cx)/mx,(y-cy)/my,1,1);ctx.restore()}}
  function frameLine(rgb,a,lw=2){const r=R();ctx.strokeStyle=`rgba(${rgb},${a})`;ctx.lineWidth=lw;ctx.strokeRect(r.x0-lw/2,r.y0-lw/2,r.x1-r.x0+lw,r.y1-r.y0+lw)}
  function runner(p,len,rgb,a){ctx.strokeStyle=`rgba(${rgb},${a})`;ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=12;i++){const e=edge(p-len*i/12),o=Math.min(W,H)*m/100*.55;const x=e.x+e.nx*o,y=e.y+e.ny*o;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
  function wave(t,amp,rgb,a){const r=R();ctx.strokeStyle=`rgba(${rgb},${a})`;ctx.lineWidth=1.5;
    for(const [yc,ph] of [[r.y0/2,0],[(H+r.y1)/2,2]]){ctx.beginPath();for(let x=0;x<=W;x+=8){const y=yc+Math.sin(x*.012+t*3+ph)*amp*Math.sin(x*.0031+t*.7)+Math.sin(x*.05+t*9)*amp*.25;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
    for(const [xc,ph] of [[r.x0/2,1],[(W+r.x1)/2,3]]){ctx.beginPath();for(let y=0;y<=H;y+=8){const x=xc+Math.sin(y*.012+t*3+ph)*amp*Math.sin(y*.0031+t*.7)+Math.sin(y*.05+t*9)*amp*.25;y?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}}
  function spawn(k,n){for(let i=0;i<n;i++){const e=edge(Math.random());
    if(k==="streak")P.push({k,x:e.x,y:e.y,vx:e.nx,vy:e.ny,s:2+Math.random()*6,life:0,max:1,w:Math.random()<.3});
    else if(k==="spark"){const r=R();const side=Math.random()<.5;const x=side?(Math.random()<.5?Math.random()*r.x0:r.x1+Math.random()*r.x0):Math.random()*W;const y=side?H*Math.random():(Math.random()<.5?Math.random()*r.y0:r.y1+Math.random()*r.y0);
      P.push({k,x,y,vx:(Math.random()-.5)*.2,vy:-.3-Math.random()*.9,s:1+Math.random()*2.5,life:0,max:2+Math.random()*3,ph:Math.random()*6})}
    else if(k==="ash")P.push({k,x:Math.random()*W,y:-5,vx:(Math.random()-.5)*.3,vy:.4+Math.random()*.8,s:1+Math.random()*2,life:0,max:14})
    else if(k==="dot")P.push({k,x:e.x,y:e.y,vx:e.nx*.25,vy:e.ny*.25,s:1.5,life:0,max:5})}}
  let last=performance.now();
  function frame(now){
    const t=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;
    ctx.clearRect(0,0,W,H);const mpx=Math.min(W,H)*m/100;
    if(mode==="idle"){ // 待機：静かな通信。光が外周をゆっくり回る
      frameLine("255,92,0",.35);glow("255,92,0",.05+.03*Math.sin(t*.8));
      runner(t*.03,.06,"255,92,0",.8);runner(t*.03+.5,.06,"255,92,0",.8);
      if(Math.random()<.06)spawn("dot",1);
    }else if(mode==="comm"){ // minatoとの通信：波形
      frameLine("255,92,0",.45);glow("255,92,0",.07);wave(t,mpx*.28,"255,92,0",.65);
    }else if(mode==="scan"){ // 撮影：走査する光と四隅の枠
      frameLine("255,92,0",.6);glow("255,92,0",.06);
      for(let i=0;i<4;i++)runner(t*.12+i*.25,.05,"255,255,255",.85);
      const r=R(),c=mpx*.6,a=.5+.4*Math.sin(t*4);ctx.strokeStyle=`rgba(255,92,0,${a})`;ctx.lineWidth=3;
      for(const [x,y,sx,sy] of [[r.x0-mpx*.5,r.y0-mpx*.5,1,1],[r.x1+mpx*.5,r.y0-mpx*.5,-1,1],[r.x0-mpx*.5,r.y1+mpx*.5,1,-1],[r.x1+mpx*.5,r.y1+mpx*.5,-1,-1]]){ctx.beginPath();ctx.moveTo(x+sx*c,y);ctx.lineTo(x,y);ctx.lineTo(x,y+sy*c);ctx.stroke()}
    }else if(mode==="warp"){ // 時空転送：光の筋が画面から外へ噴き出す
      const k=Math.min(1,t/6);
      glow("255,92,0",.18+.25*k+.08*Math.sin(t*12));frameLine("255,255,255",.5+.4*k,3);
      spawn("streak",Math.round(4+k*22));
      for(let i=0;i<3;i++)runner(t*(.25+k*.6)+i/3,.12,"255,255,255",.9);
    }else if(mode==="suspense"){ // 判定待ち：鼓動のような明滅
      const b=Math.pow(Math.max(0,Math.sin(t*2.2)),6);frameLine("255,92,0",.3+.5*b);glow("255,92,0",.04+.14*b);
    }else if(mode==="saved"){ // 救われた：白と金のやわらかい光、舞い上がる光の粒
      const a=Math.min(1,t/1.5),br=.5+.15*Math.sin(t*1.3);
      glow("255,244,214",a*br);glow("255,200,90",a*.25);frameLine("255,255,255",a*.9,3);
      if(Math.random()<.9)spawn("spark",3);
      const r=R();ctx.save();ctx.globalAlpha=a*.25;ctx.strokeStyle="#fff6dc";ctx.lineWidth=2; // 上へ伸びる光の筋
      for(let i=0;i<24;i++){const x=W*(i+.5)/24+Math.sin(t*.5+i)*10,l=mpx*(.5+.5*Math.sin(t*.9+i*1.7));ctx.beginPath();ctx.moveTo(x,r.y0);ctx.lineTo(x+(x-W/2)*.04,r.y0-l);ctx.stroke()}ctx.restore();
    }else if(mode==="partial"){ // あと一歩：光がつきかけて、ちらつきながら消えていく
      const d=Math.max(.12,1-t/7),fl=Math.random()<.12?.3:1;
      glow("255,170,60",.28*d*fl);frameLine("255,170,60",.7*d*fl);if(Math.random()<.25*d)spawn("spark",1);
    }else if(mode==="lost"){ // 救えなかった：赤い点滅（1秒に1回のゆっくりした明滅）→ 灰になって沈む
      const alarm=Math.max(0,1-Math.max(0,t-6)/3),b=reduce?.5:Math.pow(.5+.5*Math.sin(t*Math.PI*2-Math.PI/2),2);
      glow("255,20,10",alarm*(.12+.5*b));frameLine("255,40,20",alarm*(.4+.6*b),4);
      if(t>4){glow("120,120,120",Math.min(.1,(t-4)*.02));frameLine("130,130,130",Math.min(.35,(t-4)*.06)*(1-alarm));if(Math.random()<.5)spawn("ash",1)}
    }
    // 粒子
    for(const p of P){p.life+=dt;
      if(p.k==="streak"){const v=p.s*(1+p.life*14);const x0=p.x,y0=p.y;p.x+=p.vx*v;p.y+=p.vy*v;p.x+=p.vy*Math.sin(p.life*9)*.6;p.y+=p.vx*Math.sin(p.life*9)*.6;
        const a=Math.max(0,1-p.life/p.max);ctx.strokeStyle=p.w?`rgba(255,255,255,${a})`:`rgba(255,110,20,${a})`;ctx.lineWidth=1+p.s*.35;ctx.beginPath();ctx.moveTo(x0-p.vx*v*2,y0-p.vy*v*2);ctx.lineTo(p.x,p.y);ctx.stroke()}
      else if(p.k==="spark"){p.x+=p.vx+Math.sin(p.life*2+p.ph)*.3;p.y+=p.vy;const a=Math.sin(Math.PI*Math.min(1,p.life/p.max))*(.6+.4*Math.sin(p.life*8+p.ph));
        ctx.fillStyle=mode==="partial"?`rgba(255,180,80,${a})`:`rgba(255,250,225,${a})`;ctx.fillRect(p.x,p.y,p.s,p.s);
        if(p.s>2.6){ctx.fillRect(p.x-p.s*1.5,p.y+p.s*.3,p.s*4,p.s*.4);ctx.fillRect(p.x+p.s*.3,p.y-p.s*1.5,p.s*.4,p.s*4)}}
      else if(p.k==="ash"){p.x+=p.vx+Math.sin(p.life+p.x*.01)*.2;p.y+=p.vy;ctx.fillStyle="rgba(150,150,150,.5)";ctx.fillRect(p.x,p.y,p.s,p.s)}
      else if(p.k==="dot"){p.x+=p.vx;p.y+=p.vy;ctx.fillStyle=`rgba(255,92,0,${.7*(1-p.life/p.max)})`;ctx.fillRect(p.x,p.y,p.s,p.s)}
    }
    P=P.filter(p=>p.life<p.max&&p.x>-20&&p.x<W+20&&p.y>-20&&p.y<H+20);if(P.length>1500)P.splice(0,P.length-1500);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return api;
})();

/* ===== 自動リセット（展示モード）：操作がないまま時間がたつと待機画面に戻る ===== */
const IDLE=(()=>{
  // 画面ごとの「操作なしで待つ秒数」。title と warp（転送中）は対象外、confirm は画面側で撮り直しに戻す
  const LIMIT={story:60,mission:45,request:60,camera:60,error:20,result:Number(lsGet("mirai_result_sec","40"))||40};
  let since=performance.now(),page="";
  const touch=()=>{since=performance.now()};
  const api={touch,resultSec:()=>LIMIT.result,setResultSec(v){LIMIT.result=v;lsSet("mirai_result_sec",String(v))}};
  if(!EXHIBIT)return api;
  ["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,touch,true));
  setInterval(()=>{
    const el=$("#idle"),pg=card.dataset.page||"";
    if(pg!==page){page=pg;touch()}
    const lim=LIMIT[pg];
    if(!lim||staffOpen()){if(el)el.hidden=true;return}
    const left=Math.ceil(lim-(performance.now()-since)/1000);
    if(left<=0){el.hidden=true;document.body.classList.remove("desat");pageTitle();return}
    if(left<=10){el.hidden=false;el.textContent=`あと${left}秒で最初の画面に戻ります`}else el.hidden=true;
  },500);
  return api;
})();

/* ===== スタッフ用パネル（Ctrl+Shift+S で開閉） ===== */
function staffOpen(){return !!$("#staff")&&!$("#staff").hidden}
(function(){
  const el=document.createElement("div");el.id="staff";el.hidden=true;el.innerHTML=`
    <div class="sp-box"><div class="sp-hd"><b>STAFF</b><button id="spX">閉じる</button></div>
    <section><h3>カメラ</h3><div class="sp-row"><select id="spCam"></select><button id="spCamUse">このカメラを使う</button></div>
      <video id="spV" autoplay playsinline muted></video><div class="sp-st" id="spCamSt"></div></section>
    <section><h3>物理ボタン</h3><div class="sp-st">今のキー：<b id="spKeys"></b></div>
      <div class="sp-row"><button id="spLearn">ボタンを登録（押して覚えさせる）</button><button id="spKeyReset">既定に戻す</button></div>
      <div class="sp-st" id="spKeySt">最後に押されたキー：-</div></section>
    <section><h3>音</h3><div class="sp-row"><button id="spSnd">テスト音を鳴らす</button>
        <label>全体の音量 <input type="range" id="spVol" min="0" max="1.5" step="0.05"></label></div><div class="sp-st" id="spSndSt"></div></section>
    <section><h3>minatoの声（VOICEVOX）</h3><div class="sp-st" id="spVvSt">確認中…</div>
      <div class="sp-row"><select id="spVvSpk"></select><button id="spVvTest">声をテスト</button>
        <label>声の音量 <input type="range" id="spVvVol" min="0" max="1" step="0.05"></label></div>
      <div class="sp-st">VOICEVOXを起動し、設定の「CORS Policy Mode」を all にしてください。起動していないときは、ブラウザ内蔵の声で代用します。</div></section>
    <section><h3>展示モード</h3><div class="sp-st">今：<b>${EXHIBIT?"ON":"OFF"}</b>（URLに ?exhibit=1 / ?exhibit=0 で切替）</div></section>
    <section><h3>演出ありモード（外周の演出）</h3><div class="sp-st">今：<b>${FXMODE?"ON":"OFF"}</b>（URLに ?fx=1 / ?fx=0 でも切替）</div>
      <div class="sp-row"><button id="spFx">${FXMODE?"OFFにする":"ONにする"}</button>
      <label>外周の幅（片側） <select id="spFxM">${[3,5,8,10,12,15].map(v=>`<option value="${v}">${v}%</option>`).join("")}</select></label>
      <button id="spFxTest">演出を順番にテスト</button></div></section>
    <section><h3>自動リセット</h3><div class="sp-row"><label>結果画面を表示する時間 <select id="spRes">${[20,30,40,60,90,120].map(v=>`<option value="${v}">${v}秒</option>`).join("")}</select></label></div>
      <div class="sp-st">ほかの画面は、操作がないまま45〜60秒たつと最初の画面に戻ります（転送中は除く）。</div></section>
    <section><h3>リセット</h3><div class="sp-row"><button id="spReset" class="warn">TOPへ強制リセット</button><button id="spReload">ページを再読み込み</button></div></section>
    </div>`;
  document.body.appendChild(el);
  let learning=false;
  const keysUI=()=>{$("#spKeys").textContent=pushCodes().join(" / ")};
  async function fillCams(){
    const cams=await listCams(),sel=$("#spCam"),cur=stream?.getVideoTracks()[0]?.getSettings().deviceId||lsGet("mirai_cam_id","");
    sel.innerHTML=cams.map((c,i)=>`<option value="${esc(c.deviceId)}"${c.deviceId===cur?" selected":""}>${esc(c.label||"カメラ "+(i+1))}</option>`).join("")||"<option>カメラが見つかりません</option>";
    $("#spCamSt").textContent=`使用中：${camLabel()}　／　見つかったカメラ：${cams.length}台`;
  }
  async function open(){
    el.hidden=false;keysUI();fillVoice();
    try{await getCam();$("#spV").srcObject=stream}catch(e){$("#spCamSt").textContent="カメラを起動できません："+(e?.name||e?.code||e)}
    fillCams();
  }
  function close(){el.hidden=true;learning=false;$("#spV").srcObject=null}
  document.addEventListener("keydown",e=>{
    if(e.ctrlKey&&e.shiftKey&&e.code==="KeyS"){e.preventDefault();staffOpen()?close():open();return}
    if(!staffOpen())return;
    $("#spKeySt").textContent="最後に押されたキー："+e.code;
    if(learning&&!["ShiftLeft","ShiftRight","ControlLeft","ControlRight","AltLeft","AltRight","MetaLeft","MetaRight"].includes(e.code)){
      e.preventDefault();learning=false;lsSet("mirai_push_codes",JSON.stringify([e.code]));keysUI();$("#spLearn").textContent="ボタンを登録（押して覚えさせる）";
    }
  },true);
  $("#spX").onclick=close;
  $("#spCamUse").onclick=async()=>{const id=$("#spCam").value;lsSet("mirai_cam_id",id);releaseCam();try{await getCam();$("#spV").srcObject=stream}catch(e){$("#spCamSt").textContent="切り替えに失敗："+(e?.name||e)}fillCams()};
  $("#spLearn").onclick=()=>{learning=true;$("#spLearn").textContent="物理ボタンを押してください…"};
  $("#spKeyReset").onclick=()=>{try{localStorage.removeItem("mirai_push_codes")}catch{};keysUI()};
  async function fillVoice(){
    const st=await VOICE.status();
    $("#spVvSt").textContent=st.ok?`接続OK（${st.base}）　今の声：${st.spkName||"ID "+st.spk}`:`VOICEVOXに接続できません（${st.base}）。ブラウザ内蔵の声で代用中`;
    if(st.ok){try{const list=await VOICE.speakers();$("#spVvSpk").innerHTML=list.map(x=>`<option value="${x.id}"${x.id===st.spk?" selected":""}>${esc(x.name)}</option>`).join("")}catch{}}
    else $("#spVvSpk").innerHTML="<option>（未接続）</option>";
  }
  $("#spVvSpk").onchange=e=>{VOICE.setSpeaker(e.target.value);setTimeout(fillVoice,600)};
  $("#spVvTest").onclick=()=>{SND.unlock();VOICE.say(UNBOX_LINE)};
  $("#spVvVol").value=String(VOICE.vol());$("#spVvVol").oninput=e=>VOICE.setVol(Number(e.target.value));
  $("#spVol").value=String(SND.vol());$("#spVol").oninput=e=>SND.setVol(Number(e.target.value));
  $("#spSnd").onclick=()=>{SND.unlock();SND.win(true);$("#spSndSt").textContent="音が鳴らない場合：右上のSOUND表示がONか、PCの出力先スピーカーと音量を確認してください。"};
  $("#spReset").onclick=()=>{close();document.body.classList.remove("desat");pageTitle()};
  $("#spReload").onclick=()=>location.reload();
  $("#spRes").value=String(IDLE.resultSec());$("#spRes").onchange=e=>IDLE.setResultSec(Number(e.target.value));
  $("#spFx").onclick=()=>{lsSet("mirai_fx",FXMODE?"0":"1");if(!FXMODE)lsSet("mirai_exhibit","1");location.href=location.pathname};
  $("#spFxM").value=String(FXB.margin());
  $("#spFxM").onchange=e=>FXB.setMargin(Number(e.target.value));
  $("#spFxTest").onclick=()=>{close();const seq=["comm","scan","warp","suspense","saved","partial","lost","idle"];seq.forEach((m,i)=>setTimeout(()=>FXB.set(m),i*5000))};
})();

pageTitle();
</script>
