<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>未来を救えるか</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: 1画面1シーンの紙芝居。黒地＋蛍光オレンジ。上に細いヘッダー、中央に1シーンだけ */
:root{
  --bk:#0a0a0a; --line:#2b2b2b;
  --fg:#f1f1f1; --mute:#8c8c8c; --or:#ff5c00;
  --f-disp:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--bk);color:var(--fg);height:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.75}
.wrap{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:20px;padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hr{display:flex;gap:14px;align-items:center}
.snd{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--mute);background:transparent;border:1px solid var(--line);padding:4px 8px;cursor:pointer}
.snd[aria-pressed="true"]{color:#000;background:var(--or);border-color:var(--or)}
.snd:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--or);padding-bottom:10px}
.logo{font-family:var(--f-disp);font-weight:900;font-size:26px;line-height:1;letter-spacing:.04em}
.logo em{font-style:normal;color:var(--or)}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--or);text-transform:uppercase}
.mute{color:var(--mute)}

.card{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card,.pop{animation:none!important}}

.btn{font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:.04em;border:0;cursor:pointer;padding:16px 28px;background:var(--or);color:#000;display:inline-block;text-align:center}
.btn:hover{background:#ff7a2e}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-family:var(--f-body);font-size:14px;padding:12px 20px}
.btn.ghost:hover{border-color:var(--or)}
.btn:focus-visible,.shutter:focus-visible,.li:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}

/* 受付 */
.hero{font-family:var(--f-disp);font-weight:900;font-size:clamp(30px,7vw,48px);line-height:1.4;letter-spacing:.02em;margin:0;text-wrap:balance}
.hero em{font-style:normal;color:var(--or)}
.who{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;font-size:14px}
.who dt{font-family:var(--f-mono);font-size:11px;color:var(--mute);letter-spacing:.1em;padding-top:3px}
.who dd{margin:0}

/* 撮影・転送 */
.view{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;background:#000;border:1px solid var(--line);overflow:hidden}
.view video,.view canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.view .tag{position:absolute;left:10px;top:10px;font-family:var(--f-mono);font-size:11px;color:var(--or);background:#000;padding:2px 6px}
.shutter{width:72px;height:72px;border-radius:50%;border:3px solid var(--fg);background:var(--or);cursor:pointer}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.status{font-family:var(--f-disp);font-weight:900;font-size:22px;color:var(--or)}
.coord{font-family:var(--f-mono);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}

/* 結果カード */
.dots{display:flex;gap:6px}
.dots i{width:22px;height:3px;background:var(--line)}
.dots i.on{background:var(--or)}
.morph{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.morph .ph{position:relative;aspect-ratio:1;background:var(--or);overflow:hidden}
.morph .ph canvas,.morph .ph img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.15);mix-blend-mode:multiply}
.morph .arrow{font-family:var(--f-mono);color:var(--or);font-size:22px}
.morph .yr{font-family:var(--f-mono);font-size:12px;margin-top:6px}
.big{font-family:var(--f-disp);font-weight:900;font-size:clamp(26px,6vw,40px);line-height:1.4;margin:0;text-wrap:balance}
.lead{font-size:17px;margin:0;max-width:34em}
.scene{border-left:2px solid var(--line);padding-left:12px}
.scene p{margin:4px 0 0;font-size:16px;color:var(--mute)}
.quote{font-family:var(--f-disp);font-weight:700;font-size:clamp(20px,5vw,28px);line-height:1.7;margin:0;text-wrap:pretty}
.quote::before{content:"minato";display:block;font-family:var(--f-mono);font-size:12px;color:var(--or);letter-spacing:.14em;margin-bottom:6px}
.punch{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:2px solid var(--or);padding-top:16px}
.punch q{font-family:var(--f-disp);font-weight:900;font-size:clamp(20px,4.6vw,28px);color:var(--or);quotes:"「" "」";flex:1 1 240px;line-height:1.4}
.stamp{font-family:var(--f-mono);font-weight:700;font-size:13px;letter-spacing:.12em;border:2px solid var(--or);color:var(--or);padding:6px 12px;white-space:nowrap}
.pop{animation:pop .4s cubic-bezier(.2,1.5,.4,1) both .5s}
@keyframes pop{from{opacity:0;transform:scale(1.8) rotate(-6deg)}to{opacity:1;transform:none}}

/* ログ */
.log{display:flex;flex-direction:column;gap:10px}
.loglist{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.li{flex:0 0 84px;background:var(--or);border:0;padding:0;cursor:pointer;aspect-ratio:1}
.li img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15);mix-blend-mode:multiply;display:block}
.err{color:var(--or);font-size:16px}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:50;animation:fl .7s ease-out forwards}
@keyframes fl{0%{opacity:1}20%{opacity:.9;background:#ff5c00}100%{opacity:0;background:#ff5c00}}
@media (prefers-reduced-motion:reduce){.flash{display:none}}
.view.warp{border-color:var(--or);box-shadow:0 0 40px rgba(255,92,0,.35)}

/* 背景：計器の方眼＋走査線 */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
.hud{position:fixed;z-index:0;pointer-events:none;font-family:var(--f-mono);font-size:10px;line-height:1.6;letter-spacing:.08em;color:var(--or);opacity:.45;font-variant-numeric:tabular-nums;white-space:pre}
.hud.l{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.hud.r{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:right}
@media (max-width:520px){.hud.r{display:none}}

/* 通信不安定のグリッチ */
.gl{animation:glt .38s steps(1) both}
@keyframes glt{
  0%{transform:translate(0);text-shadow:none;clip-path:none}
  15%{transform:translate(-3px,0);text-shadow:2px 0 rgba(255,40,0,.85),-2px 0 rgba(0,229,255,.7);clip-path:inset(10% 0 55% 0)}
  30%{transform:translate(4px,1px);text-shadow:-3px 0 rgba(255,40,0,.85),3px 0 rgba(0,229,255,.7);clip-path:inset(48% 0 12% 0)}
  45%{transform:translate(-1px,0);clip-path:none;opacity:.55}
  60%{transform:translate(2px,-1px);text-shadow:1px 0 rgba(255,40,0,.85),-1px 0 rgba(0,229,255,.7);clip-path:inset(0 0 70% 0);opacity:1}
  80%{transform:translate(0);clip-path:inset(30% 0 30% 0)}
  100%{transform:none;text-shadow:none;clip-path:none;opacity:1}
}
.wrap.pg{animation:pg .32s steps(1) both}
@keyframes pg{0%{transform:none}20%{transform:translate(-6px,0) skewX(-2deg)}40%{transform:translate(5px,2px);filter:contrast(1.4)}60%{transform:translate(-2px,-1px);opacity:.8}80%{transform:translate(3px,0)}100%{transform:none;filter:none;opacity:1}}
.static{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;
  background:repeating-linear-gradient(0deg,rgba(255,92,0,.10) 0 1px,transparent 1px 3px),repeating-linear-gradient(0deg,transparent 0 37%,rgba(241,241,241,.08) 37% 39%,transparent 39% 71%,rgba(255,92,0,.12) 71% 72%,transparent 72%)}
.static.on{animation:st .3s steps(3) both}
@keyframes st{0%{opacity:1;background-position:0 0}33%{opacity:.7;background-position:0 23px}66%{opacity:1;background-position:0 -41px}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.gl,.wrap.pg,.static.on{animation:none}}

/* minato（粒子の人影） */
.intro{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:28px;align-items:center}
.introtext{display:flex;flex-direction:column;gap:18px;min-width:0}
.intro .hero{font-size:clamp(26px,4vw,36px)}
@media (max-width:560px){.intro{grid-template-columns:1fr;gap:16px}.intro .fig{max-width:200px}}
.fig{position:relative;width:100%;max-width:100%;aspect-ratio:3/4;background:#000}
.fig canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fig i{position:absolute;width:16px;height:16px;border:1px solid var(--or);opacity:.7}
.fig .c1{top:0;left:0;border-right:0;border-bottom:0}.fig .c2{top:0;right:0;border-left:0;border-bottom:0}
.fig .c3{bottom:22px;left:0;border-right:0;border-top:0}.fig .c4{bottom:22px;right:0;border-left:0;border-top:0}
.figid{position:absolute;left:0;right:0;bottom:0;text-align:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--mute)}
.fig.sm{width:84px;flex:0 0 84px}
.fig.sm .c3,.fig.sm .c4{bottom:0}
.speaker{display:flex;gap:14px;align-items:center}
.figname{font-family:var(--f-mono);font-size:13px;letter-spacing:.18em;color:var(--fg);margin-top:2px}

/* 未来救済モード */
a.btn{text-decoration:none}
.lbl.alert{color:var(--or);animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.story{font-size:14px;line-height:1.85;margin:0;color:var(--fg);max-width:34em}
.meter{border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mhd{display:flex;justify-content:space-between;align-items:baseline}
.mhd b{font-family:var(--f-mono);font-size:22px;color:var(--or);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--or);box-shadow:0 0 12px var(--or)}
.msub{font-size:12px}
.regain{display:flex;flex-direction:column;gap:2px}
.regainv{font-family:var(--f-disp);font-weight:900;font-size:clamp(24px,5.5vw,36px);color:var(--or);line-height:1.35}
@media (prefers-reduced-motion:reduce){.lbl.alert{animation:none}}

/* ステップ表示 */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.steps li{display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--line);padding-top:6px;min-width:0}
.steps b{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.steps span{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li.done{border-color:var(--or-dim,#7a2c00)}
.steps li.done b,.steps li.done span{color:var(--fg)}
.steps li.now{border-color:var(--or)}
.steps li.now b,.steps li.now span{color:var(--or);font-weight:700}
@media (max-width:420px){.steps span{font-size:10px}}
.or{font-style:normal;color:var(--or)}
.hints{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--line);padding:4px 10px;font-size:13px}
.judge{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--or);padding-left:12px}
.judge.ng{border-color:var(--mute)}.judge.ng .lbl{color:var(--mute)}
.result{border:2px solid var(--or);padding:14px 16px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 12px}
.result .lbl{grid-column:1/-1}
.rbig{font-family:var(--f-disp);font-weight:900;font-size:clamp(34px,8vw,54px);line-height:1.1;color:var(--or)}
.rpt{font-family:var(--f-mono);font-weight:700;font-size:16px;color:var(--or)}
.result.mid{border-color:var(--fg)}.result.mid .rbig{color:var(--fg)}
.result.lose{border-color:var(--line)}.result.lose .rbig,.result.lose .rpt,.result.lose .lbl{color:var(--mute)}
.result.win{animation:pop .45s cubic-bezier(.2,1.5,.4,1) both .15s}
.quote.nolabel::before{display:none}
.quote.nolabel{font-size:clamp(18px,4.4vw,24px);margin-top:4px}
.speaker{align-items:flex-start}

/* ===== 未来を救えるか ===== */
.title{font-family:var(--f-disp);font-weight:900;font-size:clamp(40px,11vw,84px);line-height:1.15;margin:0;letter-spacing:.01em;text-wrap:balance}
.title .ch{display:inline-block;opacity:0;transform:translateY(.3em);animation:chin .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes chin{to{opacity:1;transform:none}}
.title em{font-style:normal;color:var(--or)}
.tally{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tally div{padding:14px 0;display:flex;flex-direction:column;gap:2px}
.tally div+div{border-left:1px solid var(--line);padding-left:16px}
.tally b{font-family:var(--f-mono);font-size:clamp(30px,7vw,44px);line-height:1;font-variant-numeric:tabular-nums}
.tally .sv b{color:var(--or)}
.tally .ls b{color:var(--mute)}
.tally span{font-size:12px;color:var(--mute)}
.fade-in{opacity:0;animation:fin .6s ease forwards}
@keyframes fin{to{opacity:1}}
.figid{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.figid{font-size:9px;letter-spacing:.1em}}
.say{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:24px;align-items:center}
@media (max-width:560px){.say{grid-template-columns:1fr;gap:14px}.say .fig{max-width:170px}}
.line{font-family:var(--f-disp);font-weight:700;font-size:clamp(20px,4.6vw,28px);line-height:1.7;margin:0;min-height:5em}
.line .cur{display:inline-block;width:.5em;height:1em;background:var(--or);vertical-align:-.12em;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.mission{display:flex;flex-direction:column;gap:18px}
.mission p{margin:0;font-family:var(--f-disp);font-weight:900;font-size:clamp(24px,6vw,40px);line-height:1.45;text-wrap:balance}
.mission p.sub{font-size:clamp(18px,4.4vw,26px);color:var(--or)}
.hidden-until{visibility:hidden}

/* カメラHUD */
.hud-cam{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;background:#000;overflow:hidden;border:1px solid var(--or-line,rgba(255,92,0,.35))}
.hud-cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.05) saturate(.9)}
.hud-cam .tint{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6));pointer-events:none}
.hud-cam .br{position:absolute;width:34px;height:34px;border:2px solid var(--or)}
.hud-cam .b1{top:12px;left:12px;border-right:0;border-bottom:0}.hud-cam .b2{top:12px;right:12px;border-left:0;border-bottom:0}
.hud-cam .b3{bottom:12px;left:12px;border-right:0;border-top:0}.hud-cam .b4{bottom:12px;right:12px;border-left:0;border-top:0}
.reticle{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(255,92,0,.7);border-radius:50%}
.reticle::before,.reticle::after{content:"";position:absolute;background:var(--or)}
.reticle::before{left:50%;top:-12px;bottom:-12px;width:1px}
.reticle::after{top:50%;left:-12px;right:-12px;height:1px}
.reticle i{position:absolute;inset:14%;border:1px dashed rgba(255,92,0,.45);border-radius:50%;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scan{position:absolute;left:0;right:0;height:2px;background:var(--or);box-shadow:0 0 14px var(--or);opacity:.7;animation:scan 2.6s ease-in-out infinite alternate}
@keyframes scan{from{top:8%}to{top:92%}}
.hud-txt{position:absolute;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--or);text-shadow:0 0 6px rgba(0,0,0,.9);font-variant-numeric:tabular-nums;white-space:pre}
.ht1{top:16px;left:56px}.ht2{top:16px;right:56px;text-align:right}.ht3{bottom:16px;left:56px}.ht4{bottom:16px;right:56px;text-align:right}
.blinkr{animation:blink 1s steps(2) infinite}
@media (max-width:560px){.hud-txt{font-size:10px}.ht2{top:32px;right:auto;left:56px;text-align:left}.ht4{bottom:32px;right:auto;left:56px;text-align:left}}
.nocam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 20%;color:var(--mute);font-size:13px}
.shootrow{display:flex;justify-content:center;align-items:center;gap:18px}
.shoot{position:relative;width:84px;height:84px;border-radius:50%;border:0;background:transparent;cursor:pointer;padding:0}
.shoot::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--or);animation:spin 6s linear infinite;border-style:dashed}
.shoot::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--or);box-shadow:0 0 24px rgba(255,92,0,.6)}
.shoot:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
.shootlbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--or)}

/* 結果 */
.verdict{font-family:var(--f-disp);font-weight:900;font-size:clamp(30px,7.5vw,54px);line-height:1.3;margin:0;text-wrap:balance}
.verdict.saved{color:var(--or);text-shadow:0 0 24px rgba(255,92,0,.45)}
.verdict.partial{color:var(--fg)}
.verdict.lost{color:var(--mute)}
.vlbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em}
.sent{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.sent .ph{aspect-ratio:1;background:var(--or)}
.sent .ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15);mix-blend-mode:multiply;display:block}
.sent b{font-size:17px}
.change p{margin:4px 0 0;font-size:17px;line-height:1.8}
.talk{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start}
.talk .quote::before{display:none}
.talk .quote{font-size:clamp(18px,4.4vw,24px)}
body.desat .wrap,body.desat #bg,body.desat .hud{filter:grayscale(1) brightness(.75);transition:filter 7s ease}
.wrap,#bg,.hud{transition:filter 1s ease}

.qwrap{display:flex;flex-direction:column;gap:14px;border-left:3px solid var(--or);padding-left:16px}
.qlbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--or)}
.qtext{margin:0;font-family:var(--f-disp);font-weight:900;font-size:clamp(24px,6vw,40px);line-height:1.5;text-wrap:balance}
.qhint{margin:0;font-size:15px;color:var(--mute)}
.camq{display:flex;gap:10px;align-items:baseline}
.camq .lbl{white-space:nowrap;flex-shrink:0}
.camq p{margin:0;font-weight:700;font-size:15px;line-height:1.6}

/* ===== 16:9モニター向けサイズ調整 =====
   --u は 1920×1080 で約19px。画面の幅と高さの小さい方に合わせて全体が伸び縮みする */
:root{--u:min(1vw,1.78vh)}
html,body{height:100%}
body{font-size:clamp(15px,calc(var(--u)*1.05),22px)}
.wrap{max-width:min(94vw,168vh);height:100vh;height:100dvh;min-height:0;gap:calc(var(--u)*1.4);padding-block:calc(var(--u)*1.2) calc(var(--u)*1.6);overflow:hidden}
header{padding-bottom:calc(var(--u)*.7)}
.logo{font-size:clamp(22px,calc(var(--u)*1.8),40px)}
.lbl{font-size:clamp(11px,calc(var(--u)*.72),16px)}
.snd{font-size:clamp(11px,calc(var(--u)*.68),15px);padding:.35em .7em}
.hud{font-size:clamp(10px,calc(var(--u)*.62),14px)}
.card{min-height:0;gap:calc(var(--u)*1.6)}
.btn{font-size:clamp(18px,calc(var(--u)*1.5),34px);padding:.75em 1.4em}
.btn.ghost{font-size:clamp(14px,calc(var(--u)*1.05),22px);padding:.85em 1.3em}
.row{gap:calc(var(--u)*.9)}
.mute[style*="font-size:12px"]{font-size:clamp(12px,calc(var(--u)*.72),16px)!important}

/* タイトル */
.title{font-size:clamp(40px,calc(var(--u)*7.2),150px)}
.tally{max-width:calc(var(--u)*56)}
.tally div{padding:calc(var(--u)*.9) 0}
.tally div+div{padding-left:calc(var(--u)*1.4)}
.tally b{font-size:clamp(30px,calc(var(--u)*4.4),90px)}
.tally span{font-size:clamp(12px,calc(var(--u)*.85),18px)}

/* 語り */
.say{grid-template-columns:auto minmax(0,1fr);gap:calc(var(--u)*3)}
.say .fig{height:min(64vh,calc(var(--u)*36));width:auto;aspect-ratio:3/4}
.saytext{min-width:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.4)}
.line{font-size:clamp(20px,calc(var(--u)*2.3),48px);min-height:6.5em}
.line .intro-l{display:block;color:var(--or);margin-bottom:.4em}
.figid{font-size:clamp(9px,calc(var(--u)*.6),13px)}

/* ミッション・リクエスト */
.mission{gap:calc(var(--u)*1.6)}
.mission p{font-size:clamp(24px,calc(var(--u)*3.6),76px)}
.mission p.sub{font-size:clamp(18px,calc(var(--u)*2.2),46px)}
.qwrap{gap:calc(var(--u)*1.2);padding-left:calc(var(--u)*1.4)}
.qlbl{font-size:clamp(12px,calc(var(--u)*.9),20px)}
.qtext{font-size:clamp(24px,calc(var(--u)*3.6),76px);max-width:22em}
.qhint{font-size:clamp(15px,calc(var(--u)*1.25),26px)}

/* カメラ：左にカメラ、右にリクエストとボタン */
.camgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--u)*3);align-items:center}
.camgrid .hud-cam{height:min(74vh,calc(var(--u)*46));width:auto;aspect-ratio:4/3}
.camside{display:flex;flex-direction:column;gap:calc(var(--u)*1.6);min-width:0}
.camq{flex-direction:column;gap:calc(var(--u)*.6)}
.camq p{font-family:var(--f-disp);font-weight:900;font-size:clamp(18px,calc(var(--u)*2.3),48px);line-height:1.5}
.camhint{margin:0;color:var(--mute);font-size:clamp(14px,calc(var(--u)*1.1),24px)}
.shootbox{display:flex;align-items:center;gap:calc(var(--u)*1.2)}
.shoot{width:clamp(72px,calc(var(--u)*7),150px);height:clamp(72px,calc(var(--u)*7),150px)}
.shoot::after{inset:14%}
.shootlbl{font-size:clamp(11px,calc(var(--u)*.85),18px)}
.hud-txt{font-size:clamp(10px,calc(var(--u)*.75),16px)}
.hud-cam .br{width:calc(var(--u)*2.4);height:calc(var(--u)*2.4)}
.nocam{font-size:clamp(13px,calc(var(--u)*1),22px)}

/* 転送 */
.warpbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--u)*3);align-items:center}
.warpbox .view{height:min(70vh,calc(var(--u)*44));width:auto;aspect-ratio:4/3}
.warpinfo{display:flex;flex-direction:column;gap:calc(var(--u)*1.2);min-width:0}
.status{font-size:clamp(20px,calc(var(--u)*2.4),50px)}
.coord{font-size:clamp(12px,calc(var(--u)*1),22px)}
.mline{border-left:3px solid var(--or);padding-left:calc(var(--u)*1.2);display:flex;flex-direction:column;gap:.3em}
.mline p{margin:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(18px,calc(var(--u)*2),42px);line-height:1.5}
.mline.pop-in{animation:fin .4s ease both}

/* 結果：左に判定と送った物、右に本文 */
.resgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:calc(var(--u)*3.4);align-items:center}
.resl,.resr{display:flex;flex-direction:column;gap:calc(var(--u)*1.3);min-width:0}
.vlbl{font-size:clamp(12px,calc(var(--u)*.9),20px)}
.verdict{font-size:clamp(30px,calc(var(--u)*4.4),92px)}
.sent{grid-template-columns:clamp(72px,calc(var(--u)*13),260px) 1fr;gap:calc(var(--u)*1.2);padding-top:calc(var(--u)*1.2)}
.sent b{font-size:clamp(17px,calc(var(--u)*1.7),36px)}
.sentsub{font-size:clamp(13px,calc(var(--u)*.95),20px)}
.change p{font-size:clamp(16px,calc(var(--u)*1.25),26px);margin:.2em 0 .5em;line-height:1.65}
.change p.req{font-size:clamp(14px,calc(var(--u)*1.05),22px)}
.talk{grid-template-columns:clamp(84px,calc(var(--u)*7.5),160px) 1fr;gap:calc(var(--u)*1.2)}
.fig.sm{width:100%;flex:none}
.talk .quote{font-size:clamp(18px,calc(var(--u)*1.75),36px);line-height:1.6}
.figname{font-size:clamp(12px,calc(var(--u)*.8),18px)}
.punch{padding-top:calc(var(--u)*1)}
.punch q{font-size:clamp(20px,calc(var(--u)*2),42px)}
.err{font-size:clamp(16px,calc(var(--u)*1.4),30px)}

/* スマホ・縦長の画面：1列に並べ、縦スクロールを許す */
@media (max-width:820px),(max-aspect-ratio:1/1){
  :root{--u:min(1.6vw,1.2vh)}
  .wrap{height:auto;min-height:100%;overflow:visible}
  .say,.camgrid,.warpbox,.resgrid{grid-template-columns:1fr}
  .say .fig{height:auto;width:min(170px,45vw)}
  .camgrid .hud-cam,.warpbox .view{height:auto;width:100%}
  .line{min-height:0}
  .resgrid{align-items:start}
}

/* 結果画面（物語の順：困りごと→送った物→起きたこと→minato→判定） */
.res2{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:calc(var(--u)*3.4);align-items:center}
.res2 .resl,.res2 .resr{display:flex;flex-direction:column;gap:calc(var(--u)*1.5);min-width:0}
.r-need{display:flex;flex-direction:column;gap:calc(var(--u)*.5)}
.r-sit{margin:0;color:var(--mute);font-size:clamp(14px,calc(var(--u)*1.05),22px);line-height:1.6}
.r-req{margin:0;font-family:var(--f-disp);font-weight:900;font-size:clamp(18px,calc(var(--u)*1.9),40px);line-height:1.5;text-wrap:balance}
.r-sent{display:grid;grid-template-columns:clamp(56px,calc(var(--u)*7),140px) 1fr;gap:calc(var(--u)*1);align-items:center;border-top:1px solid var(--line);padding-top:calc(var(--u)*1.2)}
.r-sent .ph{aspect-ratio:1;background:var(--or)}
.r-sent .ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15);mix-blend-mode:multiply;display:block}
.r-sent b{font-size:clamp(15px,calc(var(--u)*1.2),26px)}
.r-hap p{margin:.2em 0 0;font-family:var(--f-disp);font-weight:700;font-size:clamp(20px,calc(var(--u)*2.2),46px);line-height:1.55;text-wrap:pretty}
.r-talk{display:grid;grid-template-columns:clamp(64px,calc(var(--u)*6),130px) 1fr;gap:calc(var(--u)*1.2);align-items:start}
.bubble{position:relative;border:2px solid var(--or);background:rgba(255,92,0,.07);padding:calc(var(--u)*.9) calc(var(--u)*1.2);display:flex;flex-direction:column;gap:.35em;min-width:0}
.bubble::before{content:"";position:absolute;left:calc(var(--u)*-1);top:calc(var(--u)*1.6);border:calc(var(--u)*.5) solid transparent;border-right-color:var(--or);border-left:0}
.r-tk{margin:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(17px,calc(var(--u)*1.6),34px);line-height:1.55;color:var(--fg)}
.bubble q{font-family:var(--f-disp);font-weight:900;font-size:clamp(17px,calc(var(--u)*1.6),34px);color:var(--or);quotes:"「" "」"}
.r-ver{border-top:2px solid var(--line);padding-top:calc(var(--u)*1)}
.r-ver.saved{border-color:var(--or)}
.r-ver .vlbl{color:var(--mute)}.r-ver.saved .vlbl{color:var(--or)}
.r-ver .verdict{font-size:clamp(30px,calc(var(--u)*4),84px);line-height:1.25}
@media (max-width:820px),(max-aspect-ratio:1/1){.res2{grid-template-columns:1fr;align-items:start}}

/* ===== 展示：PUSH案内・確認画面・スタッフパネル ===== */
.push{display:none}
body.exhibit .push:not([hidden]){cursor:pointer;display:flex;align-items:center;gap:.6em;position:fixed;left:50%;bottom:calc(var(--u)*1.6 + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;
  font-family:var(--f-mono);font-weight:700;letter-spacing:.2em;font-size:clamp(14px,calc(var(--u)*1.25),28px);color:#000;background:var(--or);padding:.55em 1.2em;box-shadow:0 0 28px rgba(255,92,0,.55);animation:pushPulse 1.6s ease-in-out infinite}
.push i{width:.8em;height:.8em;border-radius:50%;background:#000;animation:blink 1s steps(2) infinite}
.push.hit{transform:translateX(-50%) scale(.94)}
@keyframes pushPulse{50%{box-shadow:0 0 6px rgba(255,92,0,.3)}}
body.exhibit .shootbox,body.exhibit .card .btn:not(.ghost){display:none}
body.exhibit .row:has(> .btn.ghost){opacity:.55}
body.exhibit .card{padding-bottom:calc(var(--u)*4)}
.hud-cam.conf img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#staff{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;font-family:var(--f-body);font-size:14px}
#staff[hidden]{display:none}
.sp-box{background:#111;border:1px solid var(--or);width:min(720px,94vw);max-height:92vh;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sp-hd{display:flex;justify-content:space-between;align-items:center}.sp-hd b{font-family:var(--f-mono);color:var(--or);letter-spacing:.2em}
#staff h3{margin:0 0 6px;font-size:13px;color:var(--or);font-family:var(--f-mono);letter-spacing:.1em}
#staff section{border-top:1px solid var(--line);padding-top:10px}
.sp-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#staff button,#staff select{font:inherit;background:#000;color:var(--fg);border:1px solid var(--line);padding:6px 10px;cursor:pointer;max-width:100%}
#staff button:hover{border-color:var(--or)}#staff button.warn{border-color:var(--or);color:var(--or)}
#spV{width:240px;max-width:100%;aspect-ratio:4/3;background:#000;margin-top:8px;object-fit:cover}
.sp-st{color:var(--mute);font-size:12px;margin-top:4px}

/* ===== 演出ありモード：画面を中央に縮め、外周を演出に使う ===== */
#stage{display:contents}
#fxb{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;background:#000}
body.fxmode{background:#000;overflow:hidden}
body.fxmode #stage{display:block;position:fixed;inset:0;z-index:1;transform:scale(var(--fxs,.9));transform-origin:center;background:var(--bk);overflow:hidden}

.idle{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--u)*5.2 + env(safe-area-inset-bottom,0px));z-index:30;font-family:var(--f-mono);font-size:clamp(12px,calc(var(--u)*.85),18px);letter-spacing:.08em;color:var(--mute);background:rgba(0,0,0,.7);padding:.3em .9em;white-space:nowrap}

/* ===== 線画・中央レイアウト・転送シーン・想像図 ===== */
.card{position:relative}
.art{width:100%;height:100%;display:block}
.art *{fill:none;stroke:var(--or);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.art.dim{opacity:.25}
.artimg{width:100%;height:100%;object-fit:cover;display:block}
@keyframes draw{to{stroke-dashoffset:0}}
.story2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:calc(var(--u)*3);align-items:center}
.artframe{position:relative;aspect-ratio:4/3;max-height:72vh;border:1px solid rgba(255,92,0,.45);background:#000;overflow:hidden}
.artcap{position:absolute;left:0;top:0;background:#000;color:var(--or);font-family:var(--f-mono);font-size:clamp(10px,calc(var(--u)*.7),15px);letter-spacing:.14em;padding:.3em .7em}
.spk{display:grid;grid-template-columns:clamp(64px,calc(var(--u)*6),130px) 1fr;gap:calc(var(--u)*1);align-items:center}
.story2 .line{font-size:clamp(18px,calc(var(--u)*1.9),40px);min-height:7.5em}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:calc(var(--u)*1.6);position:relative;z-index:1}
.center .mission{align-items:center}
.center .qtext{max-width:18em;font-size:clamp(26px,calc(var(--u)*4.2),88px)}
.center .mission p{font-size:clamp(26px,calc(var(--u)*4.2),88px)}
.center .mission p.sub{font-size:clamp(18px,calc(var(--u)*2.4),50px)}
.artbg{position:absolute;inset:0;opacity:.13;pointer-events:none;display:flex;align-items:center;justify-content:center}
.artbg .art,.artbg .artimg{width:auto;height:100%;max-width:100%}
.tx{position:relative;width:100%;height:min(78vh,calc(var(--u)*46));background:#000;border:1px solid rgba(255,92,0,.35);overflow:hidden}
.tx canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tx-top{position:absolute;left:calc(var(--u)*1.4);top:calc(var(--u)*1.1);display:flex;flex-direction:column;gap:.2em}
.tx-arr{position:absolute;right:calc(var(--u)*1.4);top:calc(var(--u)*1.3);font-family:var(--f-mono);color:var(--or);letter-spacing:.14em;font-size:clamp(10px,calc(var(--u)*.8),17px)}
.tx-min{position:absolute;left:calc(var(--u)*1.6);bottom:calc(var(--u)*1.6);display:grid;grid-template-columns:clamp(80px,calc(var(--u)*9),190px) minmax(0,auto);gap:calc(var(--u)*1.2);align-items:center;max-width:40%;animation:fin .6s ease both}
.tx-min .bubble{animation:fin .35s ease both}
.tx-min .r-tk{font-size:clamp(18px,calc(var(--u)*1.9),40px)}
.illust{position:relative;aspect-ratio:4/3;max-height:46vh;border:1px solid rgba(255,92,0,.45);background:#000;overflow:hidden}
.illcap{position:absolute;left:0;top:0;z-index:1;background:#000;color:var(--or);font-family:var(--f-mono);font-size:clamp(10px,calc(var(--u)*.62),14px);letter-spacing:.08em;padding:.3em .7em}
.illust .r-sent{position:absolute;left:0;bottom:0;z-index:1;background:rgba(0,0,0,.82);border:0;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:calc(var(--u)*.5) calc(var(--u)*.8) calc(var(--u)*.5) calc(var(--u)*.5);grid-template-columns:clamp(40px,calc(var(--u)*3.6),76px) auto}
.illust .r-sent b{font-size:clamp(13px,calc(var(--u)*1),22px)}
.res2 .resl{gap:calc(var(--u)*1.1)}
.res2 .r-req{font-size:clamp(16px,calc(var(--u)*1.5),32px)}

*,*::before,*::after{box-sizing:border-box}

<body>
<canvas id="fxb" aria-hidden="true" hidden></canvas>
<div id="stage">
<canvas id="bg" aria-hidden="true"></canvas>
<div class="hud l" id="hudL" aria-hidden="true" data-fx="css"></div><div class="hud r" id="hudR" aria-hidden="true" data-fx="css"></div>
<div class="static" id="static" aria-hidden="true"></div>
<div class="wrap">
  <header><div class="logo" data-fx="css">未来救出局<em>.</em></div><div class="hr"><button class="snd" id="snd" aria-pressed="false">SOUND OFF</button><div class="lbl" data-fx="text">Tokyo 2060</div></div></header>
  <main class="card" id="card"></main>
  <div class="idle" id="idle" hidden></div>
  <div class="push" id="push" hidden aria-live="polite"><i></i><span>PUSH TO</span> <b id="pushL">START</b></div>
</div>
</div>
<script>

const $=s=>document.querySelector(s);
const card=$("#card");
let stream=null,unmountFig=null,cleanup=[];
/* 展示モード：URLに ?exhibit=1 を付けて開く（PUSH案内を表示、カメラを開いたままにする） */
const EXHIBIT=(()=>{try{const fq=new URLSearchParams(location.search).get("fx");if(fq!==null&&fq!=="0")localStorage.setItem("mirai_exhibit","1");const q=new URLSearchParams(location.search).get("exhibit");if(q!==null)localStorage.setItem("mirai_exhibit",q==="0"?"0":"1");return localStorage.getItem("mirai_exhibit")==="1"}catch{return new URLSearchParams(location.search).get("exhibit")==="1"}})();
if(EXHIBIT)document.body.classList.add("exhibit");
/* 演出ありモード：?fx=1（展示モードもONになる）。画面を少し縮め、外周を演出に使う */
const FXMODE=(()=>{try{const q=new URLSearchParams(location.search).get("fx");if(q!==null){localStorage.setItem("mirai_fx",q==="0"?"0":"1");if(q!=="0"){localStorage.setItem("mirai_exhibit","1");document.body.classList.add("exhibit")}}return localStorage.getItem("mirai_fx")==="1"}catch{return new URLSearchParams(location.search).get("fx")==="1"}})();
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch{}}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function releaseCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
// 展示モードではカメラを開いたままにする（毎回の起動待ちと許可確認をなくす）
function stopCam(){if(!EXHIBIT)releaseCam()}

/* ===== カメラ：外部USBカメラを優先して使う ===== */
async function listCams(){try{return (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput")}catch{return[]}}
const BUILTIN=/integrated|built-?in|facetime|内蔵|front|back camera/i;
async function getCam(){
  if(stream&&stream.getVideoTracks().some(t=>t.readyState==="live"))return stream;
  if(!navigator.mediaDevices?.getUserMedia)throw {code:"no_api"};
  let id=lsGet("mirai_cam_id","");
  if(!id){const ext=(await listCams()).find(c=>c.label&&!BUILTIN.test(c.label));if(ext)id=ext.deviceId}
  const base={width:{ideal:1920},height:{ideal:1080}};
  try{stream=await navigator.mediaDevices.getUserMedia({video:id?{...base,deviceId:{exact:id}}:{...base,facingMode:"environment"},audio:false})}
  catch(e){
    if(!id)throw e;
    // 登録したカメラが見つからないときは、使えるカメラで開く
    stream=await navigator.mediaDevices.getUserMedia({video:base,audio:false});
  }
  // 初回の許可後はカメラ名が取れるので、外部カメラがあれば切り替える
  if(!lsGet("mirai_cam_id","")){
    const cur=stream.getVideoTracks()[0]?.getSettings().deviceId;
    const ext=(await listCams()).find(c=>c.label&&!BUILTIN.test(c.label));
    if(ext&&cur&&ext.deviceId!==cur){releaseCam();return getCam2(ext.deviceId)}
  }
  stream.getVideoTracks().forEach(t=>t.onended=()=>{stream=null});
  return stream;
}
async function getCam2(id){stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920},height:{ideal:1080},deviceId:{exact:id}},audio:false});return stream}
function camLabel(){return stream?.getVideoTracks()[0]?.label||"未接続"}

/* ===== 物理ボタン：画面ごとに「押したら何をするか」を登録する ===== */
let pushAct=null,lastPush=0;
function setPush(label,fn){pushAct=fn;const el=$("#push");if(!el)return;if(!label){el.hidden=true;return}el.hidden=false;$("#pushL").textContent=label}
function clearPush(){setPush(null,null)}
function pushCodes(){try{const c=JSON.parse(lsGet("mirai_push_codes","null"));if(Array.isArray(c)&&c.length)return c}catch{}return["Enter","NumpadEnter","Space"]}
function firePush(){
  const now=performance.now();if(now-lastPush<800)return; // 連打・二重入力を防ぐ
  lastPush=now;SND.unlock();
  const f=pushAct;if(!f)return;
  pushAct=null; // 実行中は次の入力を受け付けない（次の画面で登録し直す）
  $("#push")?.classList.add("hit");setTimeout(()=>$("#push")?.classList.remove("hit"),250);
  f();
}
document.addEventListener("click",e=>{if(e.target.closest("#push"))firePush()});
document.addEventListener("keydown",e=>{
  if(staffOpen()||e.ctrlKey||e.metaKey||e.altKey)return;
  if(!pushCodes().includes(e.code))return;
  e.preventDefault();e.stopPropagation();
  if(e.repeat)return; // 長押しの連続入力は無視
  firePush();
},true);

const SVGNS="http://www.w3.org/2000/svg";
function worldArtEl(i){
  if(WORLD_IMG[i]){const im=new Image();im.src=WORLD_IMG[i];im.className="artimg";im.alt="";return im}
  const d=new DOMParser().parseFromString(`<svg xmlns="${SVGNS}" viewBox="0 0 800 600" class="art">${WORLD_ART[i]}</svg>`,"image/svg+xml");
  return document.importNode(d.documentElement,true);
}
/* 線を1本ずつ描いていくアニメーション */
function drawIn(svg,per=70,dur=900){
  if(!svg||svg.tagName==="IMG")return;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  [...svg.querySelectorAll("path,line,circle,ellipse,rect,polyline,polygon")].forEach((el,i)=>{
    if(reduce)return;
    el.setAttribute("pathLength","1");el.style.strokeDasharray="1";el.style.strokeDashoffset="1";
    el.style.animation=`draw ${dur}ms ease forwards ${i*per}ms`;
  });
}
/* AIが描いた線画を、安全な要素・属性だけ残して取り込む */
function safeSvg(str){
  try{
    const d=new DOMParser().parseFromString(String(str),"image/svg+xml"),root=d.documentElement;
    if(root.nodeName!=="svg"||d.querySelector("parsererror"))return null;
    const OK=new Set(["g","path","line","circle","ellipse","rect","polyline","polygon"]);
    const AT=new Set(["d","x","y","x1","y1","x2","y2","cx","cy","r","rx","ry","width","height","points","transform"]);
    const out=document.createElementNS(SVGNS,"svg");
    const vb=root.getAttribute("viewBox")||"";out.setAttribute("viewBox",/^[\d.\s,-]+$/.test(vb)&&vb.trim()?vb:"0 0 800 600");out.setAttribute("class","art");
    let n=0;
    (function walk(src,dst){for(const c of src.children){
      if(!OK.has(c.nodeName)||n>=200)continue;n++;
      const e=document.createElementNS(SVGNS,c.nodeName);
      for(const a of c.attributes)if(AT.has(a.name)&&a.value.length<6000&&/^[\w\s.,()+\-]*$/.test(a.value))e.setAttribute(a.name,a.value);
      dst.appendChild(e);if(c.nodeName==="g")walk(c,e);
    }})(root,out);
    return n>=3?out:null;
  }catch{return null}
}

/* 5. 時空転送：品物を粒子に分解 → 時空を流れる → 2060年でminatoの手元に再構成 */
function txScene(cv,img){
  const dpr=Math.min(1.5,devicePixelRatio||1),r=cv.getBoundingClientRect();
  const W=Math.max(320,r.width),H=Math.max(240,r.height);
  cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  // 写真を粗いマス目で読み取り、1マス＝1粒子にする
  const asp=img.width/img.height,gh=72,gw=Math.round(gh*asp);
  const off=document.createElement("canvas");off.width=gw;off.height=gh;
  const og=off.getContext("2d");og.drawImage(img,0,0,gw,gh);const px=og.getImageData(0,0,gw,gh).data;
  const rectFor=(cx,hFrac)=>{const h=H*hFrac,w=Math.min(W*.5,h*asp),hh=w/asp;return{x:cx-w/2,y:H/2-hh/2,w,h:hh}};
  const A=rectFor(W*.5,.66),B=rectFor(W*.66,.54);
  const cell=A.w/gw,P=[];
  for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){
    const k=(j*gw+i)*4;
    P.push({i,j,r:px[k],g:px[k+1],b:px[k+2],x:A.x+i*cell,y:A.y+j*cell,vx:0,vy:0,
      d:.5+(1-i/gw)*1.6+Math.random()*.7, // 右側から順にほどけていく
      d2:Math.random()*1.3,sy:(Math.random()-.5),ph:Math.random()*6.28});
  }
  const streaks=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:.4+Math.random()}));
  let phase="A",t0=performance.now(),tB=0,raf;
  function frame(now){
    const t=(now-t0)/1000;
    ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
    // 流れる光の筋（時空を移動している感じ）
    const sp=phase==="A"?Math.min(1,t/3.5):Math.max(0,1-(now-tB)/1500);
    if(sp>0&&!reduce){ctx.lineWidth=1;for(const s of streaks){s.x-=s.s*(6+sp*46);if(s.x<-80){s.x=W+Math.random()*80;s.y=Math.random()*H}
      ctx.strokeStyle=`rgba(255,92,0,${.12+.3*sp*s.s})`;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+(20+sp*160)*s.s,s.y);ctx.stroke()}}
    if(phase==="A"){
      for(const p of P){
        const k=t-p.d;
        if(k<=0){ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;ctx.fillRect(p.x,p.y,cell+.6,cell+.6);continue}
        // ほどけた粒子は右へ加速して流れていく。色はオレンジに変わる
        p.vx+=.35+k*.5;p.vy+=Math.sin(k*5+p.ph)*.25+p.sy*.05;p.x+=p.vx;p.y+=p.vy;
        if(p.x>W+30)continue;
        const m=Math.min(1,k*1.6);
        ctx.fillStyle=`rgb(${p.r+(255-p.r)*m|0},${p.g+(110-p.g)*m|0},${p.b+(20-p.b)*m|0})`;
        const s=Math.max(1.2,cell*(1-m*.45));ctx.fillRect(p.x,p.y,s+p.vx*.6,s);
      }
    }else{
      const tb=(now-tB)/1000,cellB=B.w/gw,bob=Math.sin(tb*1.6)*4;
      let settled=0;
      for(const p of P){
        const k=tb-p.d2;if(k<=0)continue;
        const tx=B.x+p.i*cellB,ty=B.y+p.j*cellB+bob;
        const e=Math.min(1,k/1.5),ee=1-Math.pow(1-e,3);
        const x=p.bx+(tx-p.bx)*ee,y=p.by+(ty-p.by)*ee+Math.sin(k*6+p.ph)*(1-ee)*18;
        if(e>=1)settled++;
        const m=1-ee;
        ctx.fillStyle=`rgb(${p.r+(255-p.r)*m|0},${p.g+(110-p.g)*m|0},${p.b+(20-p.b)*m|0})`;
        ctx.fillRect(x,y,cellB+.6+(1-ee)*10,cellB+.6);
      }
      if(settled>P.length*.97){
        // 再構成が終わったら、くっきりした写真と枠・走査線を重ねる（minatoが調べている）
        const a=Math.min(1,(tb-2.9)/.6);
        if(a>0){ctx.globalAlpha=a;ctx.drawImage(img,B.x,B.y+bob,B.w,B.h);ctx.globalAlpha=1}
        const m=14,L=26;ctx.strokeStyle="#ff5c00";ctx.lineWidth=2;
        for(const [x,y,sx,sy] of [[B.x-m,B.y-m,1,1],[B.x+B.w+m,B.y-m,-1,1],[B.x-m,B.y+B.h+m,1,-1],[B.x+B.w+m,B.y+B.h+m,-1,-1]]){ctx.beginPath();ctx.moveTo(x+sx*L,y+bob);ctx.lineTo(x,y+bob);ctx.lineTo(x,y+bob+sy*L);ctx.stroke()}
        if(!reduce){const sy=B.y+bob+((tb*.45)%1)*B.h;ctx.fillStyle="rgba(255,92,0,.75)";ctx.fillRect(B.x-m,sy,B.w+m*2,2);
          const g=ctx.createLinearGradient(0,sy-40,0,sy);g.addColorStop(0,"rgba(255,92,0,0)");g.addColorStop(1,"rgba(255,92,0,.18)");ctx.fillStyle=g;ctx.fillRect(B.x-m,sy-40,B.w+m*2,40)}
      }
      // 受付カウンターの線
      ctx.strokeStyle="rgba(255,92,0,.5)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(W*.06,B.y+B.h+34);ctx.lineTo(W*.94,B.y+B.h+34);ctx.stroke();
    }
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  return{
    stop(){cancelAnimationFrame(raf)},
    // 2060年に到着：粒子が左から流れ込んで、品物の形に戻る
    arrive(){phase="B";tB=performance.now();for(const p of P){p.bx=-40-Math.random()*W*.5;p.by=H*.5+p.sy*H*.5}}
  };
}
async function send(srcCanvas){
  const img=scaled(srcCanvas,1024),thumb=square(srcCanvas,360);

  card.dataset.page="warp";FXB.set("warp");
  let alive=true;cleanup.push(()=>alive=false);
  const scene=txScene($("#txc"),img);cleanup.push(scene.stop);
  const stopWarpSnd=SND.warp();cleanup.push(stopWarpSnd);
  const t0=performance.now(),A_SEC=5;
  const ci=setInterval(()=>{const c=$("#co");if(c)c.textContent=`YEAR ${Math.min(2060,2026+((performance.now()-t0)/(A_SEC*1000))*34).toFixed(2)}`},60);cleanup.push(()=>clearInterval(ci));
  setTimeout(()=>{const s=$("#st");if(alive&&s)s.textContent="時空を移動中"},2000);
  let res,err,done=false;

      const t=await r.text();let d;
      try{d=JSON.parse(t)}catch{throw {code:"bad_response",detail:"GASからJSON以外の応答（"+r.status+"）。デプロイのアクセス権が「全員」か、URLが /exec で終わっているか確認してください。"}}
      if(!d.ok)throw {code:d.error||"server_error",detail:d.detail};
      if(d.stats)setTally(d.stats);
      res=d.result;
    }catch(e){err=e&&e.code?e:{code:"network",detail:String(e&&e.message||e)}}
    done=true;
  })();
  // --- 分解して時空へ ---
  await sleep(A_SEC*1000);if(!alive)return;
  // --- 2060年に到着、minatoの手元で再構成 ---
  clearInterval(ci);stopWarpSnd();flash();SND.arrive();FXB.set("scan");
  scene.arrive();
  $("#co").textContent="YEAR 2060.00";$("#st").textContent="2060年・渋谷に到着";$("#txa").hidden=false;
  $("#txm").hidden=false;unmountFig=minatoFigure($("#fig"),{talk:true});
  await sleep(3200);if(!alive)return;
  // --- minatoが受け取って開ける ---
  $("#txb").hidden=false;$("#txl").textContent=UNBOX_LINE;SND.glitch();VOICE.say(UNBOX_LINE);
  await sleep(3000);if(!alive)return;
  if(!done){const s=$("#st");if(s)s.textContent="minatoが調べています…"}
  await reqP;if(!alive)return;
  if(err||!res)return fail(err);

}

function scaled(src,max){const k=Math.min(1,max/Math.max(src.width,src.height));const c=document.createElement("canvas");c.width=Math.round(src.width*k);c.height=Math.round(src.height*k);c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c}
function square(src,size){const s=Math.min(src.width,src.height);const c=document.createElement("canvas");c.width=c.height=size;c.getContext("2d").drawImage(src,(src.width-s)/2,(src.height-s)/2,s,s,0,0,size,size);return c.toDataURL("image/jpeg",.75)}


function warp(cv,img){
  const W=cv.width=960,H=cv.height=720,ctx=cv.getContext("2d"),cx=W/2,cy=H/2;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  // 色ずれ用に赤・シアンの写真を用意
  const tint=c=>{const o=document.createElement("canvas");o.width=img.width;o.height=img.height;const g=o.getContext("2d");
    g.drawImage(img,0,0);g.globalCompositeOperation="multiply";g.fillStyle=c;g.fillRect(0,0,o.width,o.height);
    g.globalCompositeOperation="destination-in";g.drawImage(img,0,0);return o};
  const R=tint("#ff2a00"),C=tint("#00e5ff");
  const fit=Math.max(W/img.width,H/img.height);
  const stars=Array.from({length:260},()=>({a:Math.random()*Math.PI*2,z:Math.random(),w:Math.random()<.25}));
  const t0=performance.now();let raf,pz=0;
  function photo(t){
    // 0〜1.1s 揺れ・色ずれ → 1.1〜2.6s 渦を巻きながら中心へ吸い込まれる
    const suck=Math.max(0,Math.min(1,(t-1.1)/1.5)),e=suck*suck*suck;
    if(suck>=1)return;
    const sc=fit*(1-e*.97),rot=e*Math.PI*3,shift=6+Math.min(t,1.1)*22+e*40;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.scale(sc,sc);ctx.globalAlpha=1-e*.4;
    const iw=img.width,ih=img.height;
    ctx.drawImage(img,-iw/2,-ih/2);
    ctx.globalCompositeOperation="lighter";ctx.globalAlpha=.55;
    ctx.drawImage(R,-iw/2+shift/sc,-ih/2);ctx.drawImage(C,-iw/2-shift/sc,-ih/2);
    ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;
    // 横ずれの帯
    const n=Math.round(3+Math.min(t,2)*6);
    for(let i=0;i<n;i++){const y=(Math.random()*ih)|0,h=(4+Math.random()*ih*.06)|0,dx=(Math.random()-.5)*iw*(.08+e*.3);
      ctx.drawImage(img,0,y,iw,h,-iw/2+dx,-ih/2+y,iw,h)}
    ctx.restore();
  }
  (function f(now){
    const t=(now-t0)/1000,sp=reduce?.004:Math.min(.045,.004+t*t*.006);
    // 残像を残して流れを出す
    ctx.fillStyle=`rgba(0,0,0,${t<1.1?1:.28})`;ctx.fillRect(0,0,W,H);
    // トンネルの輪
    pz=(pz+sp*1.6)%1;
    for(let k=0;k<10;k++){
      const z=((k/10)+pz)%1,r=Math.pow(z,2.2)*W*.9;if(r<4)continue;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.6+k*.35);
      ctx.strokeStyle=`rgba(255,92,0,${Math.min(1,z*1.4)*.9})`;ctx.lineWidth=1+z*5;
      ctx.strokeRect(-r,-r*.75,r*2,r*1.5);ctx.restore();
    }
    // 光の筋
    for(const s of stars){
      const z0=s.z;s.z+=sp*(1+s.z*3);if(s.z>1){s.z=Math.random()*.1;s.a=Math.random()*Math.PI*2;continue}
      const r0=Math.pow(z0,2)*W*.8,r1=Math.pow(s.z,2)*W*.8,ca=Math.cos(s.a+t*.3),sa=Math.sin(s.a+t*.3);
      ctx.strokeStyle=s.w?`rgba(255,255,255,${s.z})`:`rgba(255,92,0,${s.z})`;ctx.lineWidth=.5+s.z*3;
      ctx.beginPath();ctx.moveTo(cx+ca*r0,cy+sa*r0);ctx.lineTo(cx+ca*r1,cy+sa*r1);ctx.stroke();
    }
    photo(t);
    // 中心の特異点
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,60+Math.sin(t*9)*10+Math.min(t,3)*20);
    g.addColorStop(0,"rgba(255,255,255,.95)");g.addColorStop(.3,"rgba(255,92,0,.7)");g.addColorStop(1,"rgba(255,92,0,0)");

    ctx.fillStyle="rgba(0,0,0,.18)";for(let y=(t*120)%4;y<H;y+=4)ctx.fillRect(0,y,W,1);
    raf=requestAnimationFrame(f);
  })(t0);
  return()=>cancelAnimationFrame(raf);
}

/* 歪んだ写真（静止グリッチ） */
function glitch(cv,src){
  const im=new Image();im.onload=()=>{
    const S=cv.width=cv.height=320,ctx=cv.getContext("2d");ctx.drawImage(im,0,0,S,S);
    const step=()=>{ctx.drawImage(im,0,0,S,S);
      for(let i=0;i<9;i++){const y=Math.random()*S|0,h=4+Math.random()*26|0,dx=(Math.random()-.5)*60|0;ctx.drawImage(im,0,y,S,h,dx,y,S,h)}};

/* 背景アニメーション */
(function(){
  const cv=$("#bg"),ctx=cv.getContext("2d"),L=$("#hudL"),Rr=$("#hudR");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,dpr;
  function size(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener("resize",size);
  const G=48,t0=performance.now();
  function grid(){
    ctx.lineWidth=1;
    ctx.strokeStyle="rgba(255,92,0,.07)";ctx.beginPath();
    for(let x=(W/2)%G;x<W;x+=G){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H)}
    for(let y=(H/2)%G;y<H;y+=G){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5)}
    ctx.stroke();
    ctx.strokeStyle="rgba(255,92,0,.22)";ctx.beginPath();
    for(let x=(W/2)%G;x<W;x+=G)for(let y=(H/2)%G;y<H;y+=G){ctx.moveTo(x-3,y+.5);ctx.lineTo(x+4,y+.5);ctx.moveTo(x+.5,y-3);ctx.lineTo(x+.5,y+4)}
    ctx.stroke();
  }
  function frame(now){
    const t=(now-t0)/1000;
    ctx.clearRect(0,0,W,H);grid();
    if(!reduce){
      // 走査線（上から下へ、6秒周期）
      const y=((t/6)%1)*(H+160)-80;
      const g=ctx.createLinearGradient(0,y-120,0,y);
      g.addColorStop(0,"rgba(255,92,0,0)");g.addColorStop(1,"rgba(255,92,0,.10)");
      ctx.fillStyle=g;ctx.fillRect(0,y-120,W,120);
      ctx.fillStyle="rgba(255,92,0,.55)";ctx.fillRect(0,y,W,1);
      // 走査線が通った交点を光らせる
      ctx.fillStyle="rgba(255,92,0,.8)";
      const gy=Math.round((y-(H/2)%G)/G)*G+(H/2)%G;
      if(Math.abs(gy-y)<10)for(let x=(W/2)%G;x<W;x+=G)ctx.fillRect(x-1,gy-1,3,3);
      // 横に流れる細いノイズ帯（たまに）
      if((t%4)<.12){ctx.fillStyle="rgba(255,92,0,.06)";ctx.fillRect(0,(Math.sin(t*13)*.5+.5)*H,W,2+Math.random()*6)}
    }
    const yr=2026+((Math.sin(t*.4)*.5+.5)*34);
    L.textContent=`T+${t.toFixed(2).padStart(8,"0")}\nΔt=34y  SYNC ${(97+Math.sin(t*2)*2.4).toFixed(1)}%\nYEAR ${yr.toFixed(3)}`;
    Rr.textContent=`LAT 35.6580 N\nLON 139.7016 E\nDEST SHIBUYA / 窓口07`;
    if(!reduce)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();


/* サウンド（Web Audioで合成。音声ファイルなし） */
const SND=(()=>{
  let ac=null,master=null,bgmBus=null,sfxBus=null,on=false,bgmNodes=null,arpTimer=null;
  on=true;try{on=localStorage.getItem("mirai_rescue_sound")!=="off"}catch{}
  const btn=$("#snd");
  function ui(){btn.textContent=on?"SOUND ON":"SOUND OFF";btn.setAttribute("aria-pressed",on)}
  function init(){
    if(ac)return;
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=Number(lsGet("mirai_master_vol",".8"));master.connect(ac.destination);
    // 空間っぽさ用のディレイ
    const dl=ac.createDelay(1),fb=ac.createGain(),wet=ac.createGain();
    dl.delayTime.value=.33;fb.gain.value=.38;wet.gain.value=.35;
    dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);
    bgmBus=ac.createGain();bgmBus.gain.value=0;bgmBus.connect(master);bgmBus.connect(dl);
    sfxBus=ac.createGain();sfxBus.gain.value=.9;sfxBus.connect(master);sfxBus.connect(dl);
  }
  function noiseBuf(sec){const b=ac.createBuffer(1,ac.sampleRate*sec,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
  function tone(freq,dur,{type="sine",vol=.3,at=0,slide=0,bus=sfxBus}={}){
    if(!ac||!on)return;const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.05);

  function noise(dur,{vol=.3,f=2000,q=1,type="bandpass",at=0,fTo=0}={}){
    if(!ac||!on)return;const t=ac.currentTime+at,n=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
    n.buffer=noiseBuf(dur+.1);fl.type=type;fl.frequency.setValueAtTime(f,t);if(fTo)fl.frequency.exponentialRampToValueAtTime(fTo,t+dur);fl.Q.value=q;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(fl);fl.connect(g);g.connect(sfxBus);n.start(t);n.stop(t+dur+.05);
  }
  /* BGM：雰囲気（mood）ごとにドローン＋アルペジオを切り替える */
  const MOODS={
    // 通常：静かで少し不穏
    base:{drone:[[55,"sawtooth"],[82.5,"sawtooth"],[110.4,"triangle"]],cut:420,q:6,lfo:260,vol:.16,
          notes:[220,261.6,293.7,329.6,392,440,523.3],every:700,skip:.35,wave:"triangle",nv:.05,len:1.6,order:"rand"},
    // 救われた：明るく温かい（ハ長調）
    saved:{drone:[[65.4,"triangle"],[98,"sine"],[164.8,"sine"]],cut:1600,q:1,lfo:300,vol:.13,
          notes:[523.3,587.3,659.3,784,880,1046.5,1174.7,1318.5],every:240,skip:.12,wave:"triangle",nv:.07,len:.9,order:"up"},
    // あと一歩：穏やかで少し切ない
    partial:{drone:[[110,"sine"],[164.8,"sine"],[246.9,"triangle"]],cut:900,q:1.5,lfo:200,vol:.12,
          notes:[440,493.9,523.3,587.3,659.3,587.3,523.3,493.9],every:560,skip:.3,wave:"sine",nv:.065,len:1.6,order:"up"},
    // 救えなかった：寂しく、ゆっくり沈んでいく
    lost:{drone:[[55,"sine"],[82.4,"sine"],[110,"sine"]],cut:300,q:1,lfo:80,vol:.14,
          notes:[392,349.2,311.1,293.7,261.6,233.1],every:1500,skip:.45,wave:"sine",nv:.035,len:2.8,order:"down"}
  };
  let mood="base",drone=null;
  function buildDrone(m){
    const M=MOODS[m],t=ac.currentTime;
    const fl=ac.createBiquadFilter();fl.type="lowpass";fl.frequency.value=M.cut;fl.Q.value=M.q;
    const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.07;lg.gain.value=M.lfo;lfo.connect(lg);lg.connect(fl.frequency);lfo.start();
    const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.setTargetAtTime(M.vol,t,1.2);fl.connect(g);g.connect(bgmBus);
    const oscs=M.drone.map(([f,type],i)=>{const o=ac.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=(i-1)*6;o.connect(fl);o.start();return o});
    return {g,oscs:[...oscs,lfo]};

  function startArp(m){
    clearInterval(arpTimer);const M=MOODS[m];let k=0;
    arpTimer=setInterval(()=>{if(!on||Math.random()<M.skip)return;
      const N=M.notes,i=M.order==="up"?k%N.length:M.order==="down"?k%N.length:(k*3+Math.floor(Math.random()*3))%N.length;
      const f=N[i]*(M.order==="rand"&&Math.random()<.2?2:1);k++;

  }
  function setMood(m){

  function bgmDuck(v,tc=.3){if(ac)bgmBus.gain.setTargetAtTime(on?v:0,ac.currentTime,tc)}

  }
  btn.onclick=()=>setOn(!on);
  ui();
  // ブラウザは操作前に音を鳴らせないので、最初のクリックで開始
  function unlock(){if(on){init();if(ac.state!=="running")ac.resume();bgmStart()}}
  document.addEventListener("pointerdown",unlock);
  document.addEventListener("keydown",unlock);
  // ボタンのクリック音
  document.addEventListener("click",e=>{if(e.target.closest(".btn,.li"))tone(880,.08,{type:"square",vol:.06,slide:1320})});
  return{
    shutter(){noise(.12,{vol:.5,f:3000,q:.7,type:"highpass"});tone(1600,.05,{type:"square",vol:.12})},
    warp(){
      if(!ac||!on)return()=>{};
      bgmDuck(.35,1.5);
      const t=ac.currentTime,D=12;
      // ゆっくり持ち上がる柔らかいパッド（5度の和音）
      const pad=ac.createGain(),fl=ac.createBiquadFilter();
      fl.type="lowpass";fl.Q.value=2;fl.frequency.setValueAtTime(350,t);fl.frequency.linearRampToValueAtTime(1800,t+D);
      const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.25;lg.gain.value=180;lfo.connect(lg);lg.connect(fl.frequency);
      pad.gain.setValueAtTime(0,t);pad.gain.linearRampToValueAtTime(.07,t+3);
      const oscs=[110,165,220.5].map((f,i)=>{const o=ac.createOscillator();o.type=i===1?"sine":"triangle";
        o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2,t+D);o.connect(fl);return o});
      fl.connect(pad);pad.connect(sfxBus);
      // 遠くを流れる風（こもった音）
      const n=ac.createBufferSource(),nf=ac.createBiquadFilter(),ng=ac.createGain();
      n.buffer=noiseBuf(2);n.loop=true;nf.type="lowpass";nf.Q.value=.7;nf.frequency.setValueAtTime(250,t);nf.frequency.linearRampToValueAtTime(1200,t+D);
      ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(.05,t+4);
      n.connect(nf);nf.connect(ng);ng.connect(sfxBus);
      [lfo,n,...oscs].forEach(x=>x.start(t));
      // 時を刻む小さな音（1秒ごと、少しずつ高く）
      let i=0;const tick=setInterval(()=>{tone(1320+Math.min(i,20)*25,.12,{type:"sine",vol:.025});i++},1000);
      return()=>{clearInterval(tick);const e=ac.currentTime;

        pad.gain.setTargetAtTime(0,e,.25);ng.gain.setTargetAtTime(0,e,.3);[lfo,n,...oscs].forEach(x=>x.stop(e+1.5))};
    },
    arrive(){
      tone(110,1.4,{vol:.25,slide:55});noise(.9,{vol:.12,f:600,q:.5,type:"lowpass",fTo:120});
      [523.3,659.3,784,1046.5].forEach((f,i)=>tone(f,2.2,{type:"sine",vol:.06,at:.05+i*.08}));

    glitch(){for(let i=0;i<7;i++)tone(200+Math.random()*1800,.05,{type:"square",vol:.06,at:i*.09})},
    stamp(){tone(90,.25,{vol:.5,slide:50});noise(.1,{vol:.4,f:1200,q:.8})},

    setVol(v){lsSet("mirai_master_vol",String(v));if(master)master.gain.value=v},
    vol:()=>Number(lsGet("mirai_master_vol",".8")),
    mood(m){setMood(m);bgmDuck(1,1)},
    win(big){[523.3,659.3,784,1046.5].forEach((f,i)=>tone(f,.5,{type:"triangle",vol:.09,at:i*.11}));if(big)tone(1568,1.2,{type:"sine",vol:.06,at:.5})},
    lose(){tone(392,.3,{type:"triangle",vol:.08,slide:370});tone(311,.6,{type:"triangle",vol:.08,at:.28,slide:260})},
    type(){tone(1700+Math.random()*500,.025,{type:"square",vol:.012})},
